kind: live
title: barc

defaults:
  life_span: 5d

images:
  barc:
    ref: image:$[[ project.id ]]:v1
    dockerfile: $[[ flow.workspace ]]/Dockerfile
    context: $[[ flow.workspace ]]/
  

volumes:
  hf_cache:
    remote: storage:$[[ flow.project_id ]]/hf_cache
    mount: /root/.cache/huggingface
    local: hf_cache
  data:
    remote: storage:$[[ flow.project_id ]]/data
    mount: /app/data
    local: data
  output:
    remote: storage:$[[ flow.project_id ]]/output
    mount: /app/saves
    local: output

jobs:
  barc_train_induction:
    image: ${{ images.barc.ref }}
    name: barc-train-induction
    preset: H100X1
    detach: true
    env:
      HF_TOKEN: secret:HF_TOKEN
      WANDB_API_KEY: secret:WANDB_API_KEY
    volumes:
      - ${{ upload(volumes.data).ref_rw }}
      - ${{ volumes.output.ref_rw }}
      - ${{ volumes.hf_cache.ref_rw }}
    # This job runs the supervised fine-tuning script for induction.
    cmd: bash -c "cd /app && python -m finetune.alignment-handbook.scripts.run_sft.py recipes/barc/induction_config.yaml --load_in_4bit=false"

  barc_train_transduction:
    image: ${{ images.barc.ref }}
    name: barc-train-transduction
    preset: H100X1
    detach: true
    env:
      HF_TOKEN: secret:HF_TOKEN
      WANDB_API_KEY: secret:WANDB_API_KEY
    volumes:
      - ${{ upload(volumes.data).ref_rw }}
      - ${{ volumes.output.ref_rw }}
      - ${{ volumes.hf_cache.ref_rw }}
    # This job runs the supervised fine-tuning script for transduction.
    cmd: bash -c "cd /app && python -m finetune.alignment-handbook.scripts.run_sft.py recipes/barc/transduction_config.yaml --load_in_4bit=false"

  barc_evaluate:
    image: ${{ images.barc.ref }}
    name: barc-evaluate
    preset: a100x1
    detach: true
    env:
      HF_TOKEN: secret:HF_TOKEN
      WANDB_API_KEY: secret:WANDB_API_KEY
    volumes:
      - ${{ upload(volumes.data).ref_rw }}
      - ${{ volumes.output.ref_rw }}
      - ${{ volumes.hf_cache.ref_rw }}
    # This job runs your evaluation script.
    # Replace <your_model_identifier> with the finetuned model’s identifier and adjust the jsonl path as needed.
    cmd: bash -c "cd /app && python evaluation.py --model ft:<your_model_identifier> --jsonl /app/data/your_generated_problems.jsonl"
